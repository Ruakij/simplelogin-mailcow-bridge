openapi: 3.1.0
info:
  title: SimpleLogin API (Upstream Reference)
  version: "master-docs-reference"
  summary: Reference OpenAPI built from upstream SimpleLogin API documentation
  description: >-
    Reference specification derived from upstream documentation at
    `simple-login/app/docs/api.md`.

    This file is intended for internal reference in this repository and may lag
    behind upstream implementation details.

externalDocs:
  description: Upstream API documentation source
  url: https://raw.githubusercontent.com/simple-login/app/master/docs/api.md

servers:
  - url: /
    description: Local development server
  - url: https://app.simplelogin.io
    description: Official Simplelogin server

tags:
  - name: Account
  - name: Aliases
  - name: Mailboxes
  - name: Custom Domains
  - name: Contacts
  - name: Notifications
  - name: Settings
  - name: Import/Export
  - name: Misc
  - name: Phone

paths:
  /api/auth/login:
    post:
      tags: [Account]
      security: []
      summary: Authenticate with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auth/mfa:
    post:
      tags: [Account]
      security: []
      summary: Complete MFA authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthMfaRequest"
      responses:
        "200":
          description: MFA authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"

  /api/auth/facebook:
    post:
      tags: [Account]
      security: []
      deprecated: true
      summary: Authenticate with Facebook token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthFacebookRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"

  /api/auth/google:
    post:
      tags: [Account]
      security: []
      deprecated: true
      summary: Authenticate with Google token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthGoogleRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"

  /api/auth/register:
    post:
      tags: [Account]
      security: []
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
      responses:
        "200":
          description: Activation code email sent

  /api/auth/activate:
    post:
      tags: [Account]
      security: []
      summary: Activate account with email/code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthActivateRequest"
      responses:
        "200":
          description: Account activated
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          description: Too many failed attempts; reactivation required

  /api/auth/reactivate:
    post:
      tags: [Account]
      security: []
      summary: Request a new activation code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthReactivateRequest"
      responses:
        "200":
          description: Activation code email sent

  /api/auth/forgot_password:
    post:
      tags: [Account]
      security: []
      summary: Request password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthForgotPasswordRequest"
      responses:
        "200":
          description: Request accepted (always 200 upstream)

  /api/user_info:
    get:
      tags: [Account]
      summary: Get user profile information
      responses:
        "200":
          description: User info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Account]
      summary: Update user profile information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInfoPatchRequest"
      responses:
        "200":
          description: Updated user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/stats:
    get:
      tags: [Account]
      summary: Get account alias/email statistics
      responses:
        "200":
          description: Usage stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/sudo:
    patch:
      tags: [Account]
      summary: Enable sudo mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      responses:
        "200":
          description: Sudo enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/user:
    delete:
      tags: [Account]
      summary: Delete current user (requires sudo mode)
      responses:
        "200":
          description: Account scheduled for deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "440":
          $ref: "#/components/responses/NeedSudo"

  /api/user/cookie_token:
    get:
      tags: [Account]
      summary: Get one-time token for web cookie exchange
      responses:
        "200":
          description: Cookie exchange token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/api_key:
    post:
      tags: [Account]
      summary: Create a new API key
      description: Accepts Authentication header or existing authenticated web cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyCreateRequest"
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/logout:
    get:
      tags: [Account]
      summary: Log out current session
      description: Accepts Authentication header or existing authenticated web cookie.
      responses:
        "200":
          description: Logged out
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v5/alias/options:
    get:
      tags: [Aliases]
      summary: Get alias creation options and recommendations
      parameters:
        - $ref: "#/components/parameters/Hostname"
      responses:
        "200":
          description: Alias options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AliasOptionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v3/alias/custom/new:
    post:
      tags: [Aliases]
      summary: Create a custom alias
      parameters:
        - $ref: "#/components/parameters/Hostname"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AliasCustomCreateRequest"
      responses:
        "201":
          description: Alias created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alias"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/alias/random/new:
    post:
      tags: [Aliases]
      summary: Create a random alias
      parameters:
        - $ref: "#/components/parameters/Hostname"
        - $ref: "#/components/parameters/Mode"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AliasRandomCreateRequest"
      responses:
        "201":
          description: Alias created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alias"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v2/aliases:
    get:
      tags: [Aliases]
      summary: List aliases (paginated)
      parameters:
        - $ref: "#/components/parameters/PageId"
        - $ref: "#/components/parameters/Pinned"
        - $ref: "#/components/parameters/Disabled"
        - $ref: "#/components/parameters/Enabled"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
      responses:
        "200":
          description: Alias list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AliasListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Aliases]
      summary: List aliases (POST variant for clients that cannot send GET body)
      parameters:
        - $ref: "#/components/parameters/PageId"
        - $ref: "#/components/parameters/Pinned"
        - $ref: "#/components/parameters/Disabled"
        - $ref: "#/components/parameters/Enabled"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
      responses:
        "200":
          description: Alias list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AliasListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/aliases/{alias_id}:
    get:
      tags: [Aliases]
      summary: Get alias details
      parameters:
        - $ref: "#/components/parameters/AliasId"
      responses:
        "200":
          description: Alias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alias"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Aliases]
      summary: Update alias details
      parameters:
        - $ref: "#/components/parameters/AliasId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AliasPatchRequest"
      responses:
        "200":
          description: Alias updated
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Aliases]
      summary: Delete alias
      parameters:
        - $ref: "#/components/parameters/AliasId"
      responses:
        "200":
          description: Alias deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/aliases/{alias_id}/toggle:
    post:
      tags: [Aliases]
      summary: Toggle alias enabled/disabled status
      parameters:
        - $ref: "#/components/parameters/AliasId"
      responses:
        "200":
          description: New alias status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnabledResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/aliases/{alias_id}/activities:
    get:
      tags: [Aliases]
      summary: Get alias activities
      parameters:
        - $ref: "#/components/parameters/AliasId"
        - $ref: "#/components/parameters/PageId"
      responses:
        "200":
          description: Activity list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AliasActivitiesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/aliases/{alias_id}/contacts:
    get:
      tags: [Aliases]
      summary: Get alias contacts
      parameters:
        - $ref: "#/components/parameters/AliasId"
        - $ref: "#/components/parameters/PageId"
      responses:
        "200":
          description: Contact list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AliasContactsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Aliases]
      summary: Create alias contact
      parameters:
        - $ref: "#/components/parameters/AliasId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactCreateRequest"
      responses:
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "200":
          description: Contact already existed (existed=true)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/mailboxes:
    get:
      tags: [Mailboxes]
      summary: List user mailboxes
      responses:
        "200":
          description: Mailbox list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/mailboxes:
    post:
      tags: [Mailboxes]
      summary: Create mailbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailboxCreateRequest"
      responses:
        "201":
          description: Mailbox created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/mailboxes/{mailbox_id}:
    delete:
      tags: [Mailboxes]
      summary: Delete mailbox
      parameters:
        - $ref: "#/components/parameters/MailboxId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailboxDeleteRequest"
      responses:
        "200":
          description: Mailbox deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Mailboxes]
      summary: Update mailbox
      parameters:
        - $ref: "#/components/parameters/MailboxId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailboxUpdateRequest"
      responses:
        "200":
          description: Mailbox updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/custom_domains:
    get:
      tags: [Custom Domains]
      summary: List custom domains
      responses:
        "200":
          description: Custom domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomDomain"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/custom_domains/{custom_domain_id}:
    patch:
      tags: [Custom Domains]
      summary: Update custom domain
      parameters:
        - $ref: "#/components/parameters/CustomDomainId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomDomainPatchRequest"
      responses:
        "200":
          description: Updated custom domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomDomain"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/custom_domains/{custom_domain_id}/trash:
    get:
      tags: [Custom Domains]
      summary: Get deleted aliases for custom domain
      parameters:
        - $ref: "#/components/parameters/CustomDomainId"
      responses:
        "200":
          description: Deleted aliases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedAliasesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/contacts/{contact_id}:
    delete:
      tags: [Contacts]
      summary: Delete contact
      parameters:
        - $ref: "#/components/parameters/ContactId"
      responses:
        "200":
          description: Contact deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/contacts/{contact_id}/toggle:
    post:
      tags: [Contacts]
      summary: Block/unblock contact forwarding
      parameters:
        - $ref: "#/components/parameters/ContactId"
      responses:
        "200":
          description: New block_forward value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockForwardResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      parameters:
        - $ref: "#/components/parameters/NotificationsPage"
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/notifications/{notification_id}:
    post:
      tags: [Notifications]
      summary: Mark notification as read
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          description: Notification updated
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/setting:
    get:
      tags: [Settings]
      summary: Get user settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Settings]
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingPatchRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v2/setting/domains:
    get:
      tags: [Settings]
      summary: Get domains allowed for random alias creation
      responses:
        "200":
          description: Domain list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SettingDomain"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/export/data:
    get:
      tags: [Import/Export]
      summary: Export user data
      responses:
        "200":
          description: Exported data payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportDataResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/export/aliases:
    get:
      tags: [Import/Export]
      summary: Export aliases as CSV
      responses:
        "200":
          description: CSV export
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/apple/process_payment:
    post:
      tags: [Misc]
      summary: Process Apple receipt payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleProcessPaymentRequest"
      responses:
        "200":
          description: Payment processed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/phone/reservations/{reservation_id}:
    get:
      tags: [Phone]
      summary: Get phone reservation messages
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: Reservation messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneReservationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    AuthenticationHeader:
      type: apiKey
      in: header
      name: Authentication
      description: API key ("API Code") provided by SimpleLogin.

  parameters:
    Hostname:
      name: hostname
      in: query
      required: false
      description: Optional website hostname to improve alias suggestions.
      schema:
        type: string
      example: www.example.com

    Mode:
      name: mode
      in: query
      required: false
      description: Random alias generation mode.
      schema:
        type: string
        enum: [uuid, word]

    AliasId:
      name: alias_id
      in: path
      required: true
      schema:
        type: integer

    MailboxId:
      name: mailbox_id
      in: path
      required: true
      schema:
        type: integer

    CustomDomainId:
      name: custom_domain_id
      in: path
      required: true
      schema:
        type: integer

    ContactId:
      name: contact_id
      in: path
      required: true
      schema:
        type: integer

    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        type: integer

    ReservationId:
      name: reservation_id
      in: path
      required: true
      schema:
        type: string

    PageId:
      name: page_id
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

    NotificationsPage:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

    Pinned:
      name: pinned
      in: query
      required: false
      description: Return only pinned aliases (mutually exclusive with disabled/enabled).
      schema:
        type: boolean

    Disabled:
      name: disabled
      in: query
      required: false
      description: Return only disabled aliases (mutually exclusive with pinned/enabled).
      schema:
        type: boolean

    Enabled:
      name: enabled
      in: query
      required: false
      description: Return only enabled aliases (mutually exclusive with pinned/disabled).
      schema:
        type: boolean

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
      example:
        error: request body cannot be empty

    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
      example:
        ok: true

    AuthLoginRequest:
      type: object
      required: [email, password, device]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        device:
          type: string

    AuthMfaRequest:
      type: object
      required: [mfa_token, mfa_key, device]
      properties:
        mfa_token:
          type: string
        mfa_key:
          type: string
        device:
          type: string

    AuthFacebookRequest:
      type: object
      required: [facebook_token, device]
      properties:
        facebook_token:
          type: string
        device:
          type: string

    AuthGoogleRequest:
      type: object
      required: [google_token, device]
      properties:
        google_token:
          type: string
        device:
          type: string

    AuthRegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthActivateRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string

    AuthReactivateRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    AuthForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    AuthResult:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        mfa_enabled:
          type: boolean
        mfa_key:
          type: [string, "null"]
        api_key:
          type: [string, "null"]

    UserInfo:
      type: object
      properties:
        name:
          type: string
        is_premium:
          type: boolean
        email:
          type: string
          format: email
        in_trial:
          type: boolean
        trial_end_timestamp:
          type: [integer, "null"]
        profile_picture_url:
          type: [string, "null"]
        max_alias_free_plan:
          type: integer

